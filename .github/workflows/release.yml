name: Release

# Bumps the latest v*.*.* tag, tags the current commit and starts the "Desktop app" workflow on it,
# which builds the installers and publishes the GitHub Release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency: release

permissions:
  contents: write # push the tag
  actions: write # start the Desktop app workflow

jobs:
  tag:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Work out the next tag
        id: next
        run: echo "tag=$(git tag | node .github/scripts/next-tag.mjs '${{ inputs.bump }}')" >> "$GITHUB_OUTPUT"

      - name: Create the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.next.outputs.tag }}" -m "Release ${{ steps.next.outputs.tag }}"
          git push origin "${{ steps.next.outputs.tag }}"

      # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so start the build explicitly.
      - name: Start the desktop build on the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run desktop.yml --ref "${{ steps.next.outputs.tag }}"

      - name: Summary
        run: echo "Released ${{ steps.next.outputs.tag }}. The build is running in the Desktop app workflow." >> "$GITHUB_STEP_SUMMARY"
