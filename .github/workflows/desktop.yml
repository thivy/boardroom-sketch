name: Desktop app

# Builds the Tauri app on each OS. Every run uploads the installers as workflow artifacts;
# pushing a tag like v0.1.0 also publishes them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # The sidecar is a copy of this Node, and the server uses node:sqlite (22.13+).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: bun install --frozen-lockfile

      # The updater compares this version with the installed one, so a release must carry its tag's version.
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const file = 'apps/desktop/src-tauri/tauri.conf.json';
            const config = JSON.parse(fs.readFileSync(file, 'utf8'));
            config.version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
          "

      - name: Build the desktop app
        env:
          # Signs the update packages; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run desktop:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: boardroom-sketch-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/**/*.sig

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: actions/checkout@v4

      # Names without spaces, and latest.json: the file the installed app checks for a newer version.
      - name: Write the updater manifest
        run: node .github/scripts/updater-manifest.mjs installers "${{ github.ref_name }}" "${{ github.repository }}"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/**/*
            installers/latest.json
          generate_release_notes: true
